services:
  postgres:
    image: postgres:16
    container_name: creativeflow-postgres
    restart: always

    environment:
      POSTGRES_USER: creativeflow
      POSTGRES_PASSWORD: creativeflow123
      POSTGRES_DB: creativeflow_dw

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  metabase:
    image: metabase/metabase:latest
    container_name: creativeflow-metabase
    restart: always

    ports:
      - "3000:3000"

    environment:
      MB_DB_FILE: /metabase-data/metabase.db

    volumes:
      - metabase_data:/metabase-data

    depends_on:
      - postgres


volumes:
  postgres_data:
  metabase_data: